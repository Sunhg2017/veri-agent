name: WP1 Platform API

on:
  pull_request:
    paths:
      - "pom.xml"
      - "db/migration/**"
      - "platform-api/**"
      - "scripts/wp1_db_profile_smoke.sh"
      - ".github/workflows/wp1-platform-api.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "pom.xml"
      - "db/migration/**"
      - "platform-api/**"
      - "scripts/wp1_db_profile_smoke.sh"
      - ".github/workflows/wp1-platform-api.yml"
  workflow_dispatch:

jobs:
  platform-api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run platform-api tests
        run: |
          bash scripts/wp1_single_platform_guard.sh
          mvn -B -pl platform-api test

      - name: Upload WP1 OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: wp1-openapi-contract
          path: build/openapi/wp1-v1.json
          if-no-files-found: error

  db-profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: veri_agent
          POSTGRES_USER: veri_agent
          POSTGRES_PASSWORD: veri_agent_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veri_agent -d veri_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start platform-api with db profile
        env:
          WP1_BOOTSTRAP_TOKEN: local-init-token
          WP1_AUTH_TOKEN_SECRET: local-auth-secret
          WP1_DATASOURCE_URL: jdbc:postgresql://localhost:5432/veri_agent
          WP1_DATASOURCE_USERNAME: veri_agent
          WP1_DATASOURCE_PASSWORD: veri_agent_dev
        run: |
          mkdir -p build
          mvn -B -pl platform-api spring-boot:run -Dspring-boot.run.profiles=db > build/wp1-platform-api-db.log 2>&1 &
          echo "$!" > build/wp1-platform-api-db.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat build/wp1-platform-api-db.log
          exit 1

      - name: Run db profile smoke
        env:
          WP1_BOOTSTRAP_TOKEN: local-init-token
        run: bash scripts/wp1_db_profile_smoke.sh

      - name: Stop platform-api
        if: always()
        run: |
          if [ -f build/wp1-platform-api-db.pid ]; then
            kill "$(cat build/wp1-platform-api-db.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload platform-api db profile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp1-platform-api-db-log
          path: build/wp1-platform-api-db.log
          if-no-files-found: warn
