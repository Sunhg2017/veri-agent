name: WP2 Model Access

on:
  pull_request:
    paths:
      - "pom.xml"
      - "platform-api/src/main/java/com/songhg/veri/agent/modelaccess/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/auth/config/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/authorization/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/common/security/ServiceTokenAuthenticationFilter.java"
      - "platform-api/src/main/java/com/songhg/veri/agent/integration/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/security/config/SecurityConfig.java"
      - "platform-api/src/main/resources/application.yml"
      - "platform-api/src/main/resources/mapper/modelaccess/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/integration/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/modelaccess/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/common/openapi/OpenApiContractTest.java"
      - "portal-web/src/api/auth.ts"
      - "portal-web/src/api/auth.test.ts"
      - "portal-web/src/api/modelAccess.ts"
      - "portal-web/src/api/modelAccess.test.ts"
      - "portal-web/src/components/ModelAccessConsole.tsx"
      - "portal-web/src/permissions.ts"
      - "portal-web/src/permissions.test.ts"
      - "portal-web/src/App.tsx"
      - "portal-web/src/styles.css"
      - "portal-web/package.json"
      - "portal-web/package-lock.json"
      - "db/migration/wp1/**"
      - "db/seed/**"
      - "db/migration/README.md"
      - "scripts/wp2_quality_gate.sh"
      - "scripts/wp_all_integration_test.sh"
      - "scripts/wp2_model_access_smoke.sh"
      - "scripts/wp2_module_policy_smoke.sh"
      - "db/validation/run_wp2_db_validation.sh"
      - "db/validation/wp2_model_access_validation.sql"
      - "db/validation/wp1_seed_validation.sql"
      - ".github/workflows/wp2-model-access.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "pom.xml"
      - "platform-api/src/main/java/com/songhg/veri/agent/modelaccess/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/auth/config/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/authorization/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/common/security/ServiceTokenAuthenticationFilter.java"
      - "platform-api/src/main/java/com/songhg/veri/agent/integration/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/security/config/SecurityConfig.java"
      - "platform-api/src/main/resources/application.yml"
      - "platform-api/src/main/resources/mapper/modelaccess/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/integration/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/modelaccess/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/common/openapi/OpenApiContractTest.java"
      - "portal-web/src/api/auth.ts"
      - "portal-web/src/api/auth.test.ts"
      - "portal-web/src/api/modelAccess.ts"
      - "portal-web/src/api/modelAccess.test.ts"
      - "portal-web/src/components/ModelAccessConsole.tsx"
      - "portal-web/src/permissions.ts"
      - "portal-web/src/permissions.test.ts"
      - "portal-web/src/App.tsx"
      - "portal-web/src/styles.css"
      - "portal-web/package.json"
      - "portal-web/package-lock.json"
      - "db/migration/wp1/**"
      - "db/seed/**"
      - "db/migration/README.md"
      - "scripts/wp2_quality_gate.sh"
      - "scripts/wp_all_integration_test.sh"
      - "scripts/wp2_model_access_smoke.sh"
      - "scripts/wp2_module_policy_smoke.sh"
      - "db/validation/run_wp2_db_validation.sh"
      - "db/validation/wp2_model_access_validation.sql"
      - "db/validation/wp1_seed_validation.sql"
      - ".github/workflows/wp2-model-access.yml"
  workflow_dispatch:

jobs:
  wp2-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal-web/package-lock.json

      - name: Install portal-web dependencies
        working-directory: portal-web
        run: npm ci

      - name: Run WP2 quality gate
        run: bash scripts/wp2_quality_gate.sh

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp2-db-validation-logs
          path: build/wp2-db-validation/
          if-no-files-found: warn
