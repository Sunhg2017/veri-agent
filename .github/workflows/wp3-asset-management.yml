name: WP3 Asset Management

on:
  pull_request:
    paths:
      - "pom.xml"
      - "platform-api/src/main/java/com/songhg/veri/agent/asset/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/auth/config/BearerTokenAuthenticationFilter.java"
      - "platform-api/src/main/java/com/songhg/veri/agent/authorization/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/common/security/ServiceTokenAuthenticationFilter.java"
      - "platform-api/src/main/resources/mapper/asset/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/asset/**"
      - "portal-web/src/api/assets.ts"
      - "portal-web/src/api/assets.test.ts"
      - "portal-web/src/components/AssetWorkbench.tsx"
      - "portal-web/src/permissions.ts"
      - "portal-web/src/permissions.test.ts"
      - "portal-web/src/App.tsx"
      - "portal-web/src/styles.css"
      - "db/migration/wp1/V20260518_014__wp3_asset_base_schema.sql"
      - "db/validation/wp_all_schema_validation.sql"
      - "scripts/wp3_asset_smoke.sh"
      - "scripts/wp3_quality_gate.sh"
      - ".github/workflows/wp3-asset-management.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "pom.xml"
      - "platform-api/src/main/java/com/songhg/veri/agent/asset/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/auth/config/BearerTokenAuthenticationFilter.java"
      - "platform-api/src/main/java/com/songhg/veri/agent/authorization/**"
      - "platform-api/src/main/java/com/songhg/veri/agent/common/security/ServiceTokenAuthenticationFilter.java"
      - "platform-api/src/main/resources/mapper/asset/**"
      - "platform-api/src/test/java/com/songhg/veri/agent/asset/**"
      - "portal-web/src/api/assets.ts"
      - "portal-web/src/api/assets.test.ts"
      - "portal-web/src/components/AssetWorkbench.tsx"
      - "portal-web/src/permissions.ts"
      - "portal-web/src/permissions.test.ts"
      - "portal-web/src/App.tsx"
      - "portal-web/src/styles.css"
      - "db/migration/wp1/V20260518_014__wp3_asset_base_schema.sql"
      - "db/validation/wp_all_schema_validation.sql"
      - "scripts/wp3_asset_smoke.sh"
      - "scripts/wp3_quality_gate.sh"
      - ".github/workflows/wp3-asset-management.yml"
  workflow_dispatch:

jobs:
  asset-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal-web/package-lock.json

      - name: Install portal-web dependencies
        working-directory: portal-web
        run: npm ci

      - name: Run WP3 quality gate
        run: bash scripts/wp3_quality_gate.sh

      - name: Upload WP3 DB validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-db-validation-logs
          path: build/wp1-db-validation/
          if-no-files-found: warn
