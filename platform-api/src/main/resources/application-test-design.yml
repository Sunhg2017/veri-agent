veri-agent:
  test-design:
    service-token: ${WP5_SERVICE_TOKEN:local-test-design-token}
    generation-enabled: true
    generation-mode: ${WP5_GENERATION_MODE:RULE_TEMPLATE}
    prompt-key: ${WP5_PROMPT_KEY:wp5-test-design-v1}
    prompt-version: ${WP5_PROMPT_VERSION:1.0.0}
    model-fallback-enabled: ${WP5_MODEL_FALLBACK_ENABLED:false}
    max-requirements-per-task: ${WP5_MAX_REQUIREMENTS_PER_TASK:20}
    max-cases-per-requirement: ${WP5_CASE_COUNT_PER_REQUIREMENT_MAX:3}
    context-linked-assets-per-requirement: ${WP5_CONTEXT_LINKED_ASSETS_PER_REQUIREMENT:5}
    context-explicit-assets-per-type: ${WP5_CONTEXT_EXPLICIT_ASSETS_PER_TYPE:5}
    context-existing-cases-per-requirement: ${WP5_CONTEXT_EXISTING_CASES_PER_REQUIREMENT:5}
    context-requirement-description-chars: ${WP5_CONTEXT_REQUIREMENT_DESCRIPTION_CHARS:240}
    context-acceptance-criteria-chars: ${WP5_CONTEXT_ACCEPTANCE_CRITERIA_CHARS:240}
    context-asset-schema-chars: ${WP5_CONTEXT_ASSET_SCHEMA_CHARS:240}
    batch-action-limit: ${WP5_BATCH_ACTION_MAX_SIZE:100}
    async-generation-enabled: ${WP5_ASYNC_GENERATION_ENABLED:true}
    async-publish-enabled: ${WP5_ASYNC_PUBLISH_ENABLED:true}
    event-recovery-enabled: ${WP5_EVENT_RECOVERY_ENABLED:true}
    event-recovery-batch-size: ${WP5_EVENT_RECOVERY_BATCH_SIZE:100}
    event-recovery-running-timeout-seconds: ${WP5_EVENT_RECOVERY_RUNNING_TIMEOUT_SECONDS:600}
    event-recovery-queue-lag-warning-seconds: ${WP5_EVENT_RECOVERY_QUEUE_LAG_WARNING_SECONDS:120}
    event-recovery-cron: "${WP5_EVENT_RECOVERY_CRON:0 */2 * * * *}"
    publish-event-recovery-enabled: ${WP5_PUBLISH_EVENT_RECOVERY_ENABLED:true}
    publish-event-recovery-batch-size: ${WP5_PUBLISH_EVENT_RECOVERY_BATCH_SIZE:100}
    publish-event-recovery-running-timeout-seconds: ${WP5_PUBLISH_EVENT_RECOVERY_RUNNING_TIMEOUT_SECONDS:600}
    publish-event-recovery-queue-lag-warning-seconds: ${WP5_PUBLISH_EVENT_RECOVERY_QUEUE_LAG_WARNING_SECONDS:120}
    publish-event-recovery-cron: "${WP5_PUBLISH_EVENT_RECOVERY_CRON:30 */2 * * * *}"
    readiness-min-step-complete-percent: ${WP5_READINESS_MIN_STEP_COMPLETE_PERCENT:100}
    readiness-min-expected-complete-percent: ${WP5_READINESS_MIN_EXPECTED_COMPLETE_PERCENT:100}
    readiness-max-low-confidence-percent: ${WP5_READINESS_MAX_LOW_CONFIDENCE_PERCENT:20}
    readiness-max-error-percent: ${WP5_READINESS_MAX_ERROR_PERCENT:0}
    readiness-max-duplicate-key-collisions: ${WP5_READINESS_MAX_DUPLICATE_KEY_COLLISIONS:0}
    readiness-max-missing-requirement-count: ${WP5_READINESS_MAX_MISSING_REQUIREMENT_COUNT:0}
    readiness-max-missing-title-count: ${WP5_READINESS_MAX_MISSING_TITLE_COUNT:0}
    release-readiness-publish-blocking-enabled: ${WP5_RELEASE_READINESS_PUBLISH_BLOCKING_ENABLED:false}
    conflict-title-similarity-threshold: ${WP5_CONFLICT_TITLE_SIMILARITY_THRESHOLD:0.86}
    conflict-content-similarity-threshold: ${WP5_CONFLICT_CONTENT_SIMILARITY_THRESHOLD:0.90}
    publish-compensation-enabled: ${WP5_PUBLISH_COMPENSATION_ENABLED:true}
    publish-compensation-batch-size: ${WP5_PUBLISH_COMPENSATION_BATCH_SIZE:50}
    publish-compensation-cron: "${WP5_PUBLISH_COMPENSATION_CRON:0 */5 * * * *}"
    report-archive-retention-days: ${WP5_REPORT_ARCHIVE_RETENTION_DAYS:180}
    report-archive-external-sharing-allowed: ${WP5_REPORT_ARCHIVE_EXTERNAL_SHARING_ALLOWED:false}
    report-archive-approval-required: ${WP5_REPORT_ARCHIVE_APPROVAL_REQUIRED:true}
