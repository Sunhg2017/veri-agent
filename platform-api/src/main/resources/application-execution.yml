veri-agent:
  execution:
    scheduler-enabled: ${WP9_SCHEDULER_ENABLED:false}
    webhook-enabled: ${WP9_WEBHOOK_ENABLED:false}
    cron-enabled: ${WP9_CRON_ENABLED:false}
    max-concurrent-runs-per-project: ${WP9_MAX_CONCURRENT_RUNS_PER_PROJECT:2}
    max-concurrent-nodes-per-run: ${WP9_MAX_CONCURRENT_NODES_PER_RUN:4}
    node-heartbeat-timeout-seconds: ${WP9_NODE_HEARTBEAT_TIMEOUT_SECONDS:180}
    default-run-timeout-seconds: ${WP9_DEFAULT_RUN_TIMEOUT_SECONDS:1800}
    recovery-batch-size: ${WP9_RECOVERY_BATCH_SIZE:50}
