spring:
  application:
    name: platform-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p trace_id=%X{trace_id:-}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

veri-agent:
  bootstrap:
    token: ${WP1_BOOTSTRAP_TOKEN:}
  auth:
    token-secret: ${WP1_AUTH_TOKEN_SECRET:${WP1_BOOTSTRAP_TOKEN:}}
    access-token-ttl-minutes: ${WP1_ACCESS_TOKEN_TTL_MINUTES:30}
  integration:
    service-token: ${WP1_SERVICE_TOKEN:local-platform-service-token}
  model-access:
    service-token: ${WP2_SERVICE_TOKEN:local-model-access-token}
    default-model: ${WP2_DEFAULT_MODEL:local-echo}
    max-prompt-chars: ${WP2_MAX_PROMPT_CHARS:12000}
    daily-platform-cost-limit: ${WP2_DAILY_PLATFORM_COST_LIMIT:0}
    daily-project-cost-limit: ${WP2_DAILY_PROJECT_COST_LIMIT:0}
    budget-estimated-output-tokens: ${WP2_BUDGET_ESTIMATED_OUTPUT_TOKENS:0}
    budget-zone-id: ${WP2_BUDGET_ZONE_ID:Asia/Shanghai}
    max-export-rows: ${WP2_MAX_EXPORT_ROWS:10000}
    provider-max-retries: ${WP2_PROVIDER_MAX_RETRIES:1}
    provider-circuit-failure-threshold: ${WP2_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:3}
    provider-circuit-open-ms: ${WP2_PROVIDER_CIRCUIT_OPEN_MS:60000}
    provider-check-cache-ttl-ms: ${WP2_PROVIDER_CHECK_CACHE_TTL_MS:30000}
    cost-alert-warning-ratio: ${WP2_COST_ALERT_WARNING_RATIO:0.8}
  asset:
    service-token: ${WP3_SERVICE_TOKEN:local-asset-token}
