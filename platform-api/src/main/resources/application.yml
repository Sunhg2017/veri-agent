spring:
  config:
    import:
      - classpath:application-auth.yml
      - classpath:application-platform.yml
      - classpath:application-model-access.yml
      - classpath:application-asset.yml
      - classpath:application-document-input.yml
      - classpath:application-test-design.yml
      - classpath:application-execution.yml
      - classpath:application-events.yml
  application:
    name: platform-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p trace_id=%X{trace_id:-}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.songhg.veri.agent.common.mybatis
