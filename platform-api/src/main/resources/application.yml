spring:
  config:
    import:
      - classpath:application-auth.yml
      - classpath:application-platform.yml
      - classpath:application-model-access.yml
      - classpath:application-asset.yml
      - classpath:application-document-input.yml
      - classpath:application-test-design.yml
      - classpath:application-execution.yml
      - classpath:application-test-data.yml
      - classpath:application-reporting.yml
      - classpath:application-events.yml
  application:
    name: platform-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p trace_id=%X{trace_id:-}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.songhg.veri.agent.common.mybatis

veri-agent:
  security:
    cors:
      allowed-origins: ${PLATFORM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      allowed-origin-patterns: ${PLATFORM_CORS_ALLOWED_ORIGIN_PATTERNS:}
      allowed-methods: ${PLATFORM_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${PLATFORM_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Trace-Id,X-Caller-Service,X-Delegated-User-Id,X-VA-Timestamp,X-VA-Signature,X-VA-Event-Id}
      exposed-headers: ${PLATFORM_CORS_EXPOSED_HEADERS:X-Trace-Id}
      allow-credentials: ${PLATFORM_CORS_ALLOW_CREDENTIALS:true}
      max-age-seconds: ${PLATFORM_CORS_MAX_AGE_SECONDS:3600}
