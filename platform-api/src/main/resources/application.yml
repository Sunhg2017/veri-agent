spring:
  application:
    name: platform-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p trace_id=%X{trace_id:-}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

veri-agent:
  bootstrap:
    token: ${WP1_BOOTSTRAP_TOKEN:}
  auth:
    token-secret: ${WP1_AUTH_TOKEN_SECRET:${WP1_BOOTSTRAP_TOKEN:}}
    access-token-ttl-minutes: ${WP1_ACCESS_TOKEN_TTL_MINUTES:30}
  integration:
    service-token: ${WP1_SERVICE_TOKEN:local-platform-service-token}
