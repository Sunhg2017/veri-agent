veri-agent:
  auth:
    token-secret: ${WP1_AUTH_TOKEN_SECRET:}
    access-token-ttl-minutes: ${WP1_ACCESS_TOKEN_TTL_MINUTES:30}
    session-cleanup-enabled: ${WP1_SESSION_CLEANUP_ENABLED:true}
    session-cleanup-retention-seconds: ${WP1_SESSION_CLEANUP_RETENTION_SECONDS:86400}
    session-cleanup-interval-ms: ${WP1_SESSION_CLEANUP_INTERVAL_MS:3600000}
    password-change-required:
      # Only recovery, auth bootstrap and platform health/documentation endpoints bypass forced password change.
      allowed-requests:
        - method: "*"
          path: /actuator/
          match: prefix
        - method: "*"
          path: /v3/api-docs/
          match: prefix
        - method: "*"
          path: /swagger-ui/
          match: prefix
        - method: "*"
          path: /swagger-ui.html
          match: exact
        - method: GET
          path: /api/v1/health
          match: exact
        - method: GET
          path: /api/v1/model-access/health
          match: exact
        - method: GET
          path: /api/v1/asset/health
          match: exact
        - method: GET
          path: /api/v1/document-input/health
          match: exact
        - method: GET
          path: /api/v1/auth/me
          match: exact
        - method: POST
          path: /api/v1/auth/login
          match: exact
        - method: POST
          path: /api/v1/auth/refresh
          match: exact
        - method: POST
          path: /api/v1/auth/logout
          match: exact
        - method: POST
          path: /api/v1/auth/change-password
          match: exact
