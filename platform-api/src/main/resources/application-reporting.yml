veri-agent:
  reporting:
    enabled: ${WP10_REPORTING_ENABLED:true}
    generate-enabled: ${WP10_REPORT_GENERATE_ENABLED:true}
    async-generation-enabled: ${WP10_REPORT_ASYNC_GENERATION_ENABLED:false}
    generation-worker-enabled: ${WP10_REPORT_GENERATION_WORKER_ENABLED:true}
    generation-worker-interval-ms: ${WP10_REPORT_GENERATION_WORKER_INTERVAL_MS:5000}
    generation-worker-initial-delay-ms: ${WP10_REPORT_GENERATION_WORKER_INITIAL_DELAY_MS:30000}
    generation-worker-id: ${WP10_REPORT_GENERATION_WORKER_ID:wp10-report-worker}
    generation-worker-batch-size: ${WP10_REPORT_GENERATION_WORKER_BATCH_SIZE:4}
    generation-running-timeout-seconds: ${WP10_REPORT_GENERATION_RUNNING_TIMEOUT_SECONDS:1800}
    generation-recovery-batch-size: ${WP10_REPORT_GENERATION_RECOVERY_BATCH_SIZE:50}
    diagnosis-enabled: ${WP10_DIAGNOSIS_ENABLED:true}
    defect-draft-enabled: ${WP10_DEFECT_DRAFT_ENABLED:true}
    export-enabled: ${WP10_REPORT_EXPORT_ENABLED:true}
    max-evidence-items: ${WP10_MAX_EVIDENCE_ITEMS:200}
    max-diagnosis-context-chars: ${WP10_MAX_DIAGNOSIS_CONTEXT_CHARS:12000}
    max-export-markdown-chars: ${WP10_MAX_EXPORT_MARKDOWN_CHARS:30000}
    schema-version: ${WP10_REPORT_SCHEMA_VERSION:wp10-report-v1}
    field-set-version: ${WP10_REPORT_FIELD_SET_VERSION:wp10-report-export-fields-v1}
