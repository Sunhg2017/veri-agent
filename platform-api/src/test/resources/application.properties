spring.profiles.default=local
spring.config.import=classpath:application-auth.yml,classpath:application-platform.yml,classpath:application-model-access.yml,classpath:application-asset.yml,classpath:application-document-input.yml,classpath:application-test-design.yml,classpath:application-execution.yml,classpath:application-test-data.yml,classpath:application-reporting.yml,classpath:application-events.yml
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-handlers-package=com.songhg.veri.agent.common.mybatis
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

veri-agent.auth.access-token-ttl-minutes=30
veri-agent.auth.session-cleanup-retention-seconds=86400
veri-agent.audit.retention-days=365
veri-agent.audit.min-retention-days=30
veri-agent.audit.retention-cleanup-batch-size=1000
veri-agent.security.cors.allow-credentials=true
