services:
  postgres:
    image: postgres:15-alpine
    container_name: veri-agent-wp1-postgres
    environment:
      POSTGRES_DB: veri_agent
      POSTGRES_USER: veri_agent
      POSTGRES_PASSWORD: veri_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - veri-agent-wp1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veri_agent -d veri_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  veri-agent-wp1-postgres:
