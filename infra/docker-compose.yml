# Veri Agent — 集成部署 (Postgres + platform-api + 前端)
# 使用: docker compose -f infra/docker-compose.yml up -d
# 停止: docker compose -f infra/docker-compose.yml down

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL (共享数据库)
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: veri-agent-postgres
    environment:
      POSTGRES_DB: veri_agent
      POSTGRES_USER: veri_agent
      POSTGRES_PASSWORD: veri_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - veri-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veri_agent -d veri_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - veri-agent-net

  # ─────────────────────────────────────────────────
  # Redis (Redisson client; shared cache/resilience state)
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: veri-agent-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - veri-agent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - veri-agent-net

  # ─────────────────────────────────────────────────
  # Kafka (event-driven async jobs)
  # ─────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.1
    container_name: veri-agent-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - veri-agent-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - veri-agent-net

  # ─────────────────────────────────────────────────
  # XXL-JOB MySQL + Admin (shared scheduling control plane)
  # ─────────────────────────────────────────────────
  xxl-job-mysql:
    build:
      context: ..
      dockerfile: infra/Dockerfile.xxl-job-mysql
    container_name: veri-agent-xxl-job-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: xxl_job
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - veri-agent-xxl-job-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_pwd >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - veri-agent-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.1.0
    container_name: veri-agent-xxl-job-admin
    ports:
      - "8088:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=root_pwd
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --xxl.job.accessToken=shared-xxl-job-access-token
    volumes:
      - veri-agent-xxl-job-admin:/data/applogs
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - veri-agent-net

  # ─────────────────────────────────────────────────
  # platform-api (统一管理控制面，含 WP1 + WP2 + WP3 功能)
  # ─────────────────────────────────────────────────
  platform-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.platform-api
    container_name: veri-agent-platform-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: db,redis,kafka
      # 数据库
      WP1_DATASOURCE_URL: jdbc:postgresql://postgres:5432/veri_agent
      WP1_DATASOURCE_USERNAME: veri_agent
      WP1_DATASOURCE_PASSWORD: veri_agent_dev
      WP1_FLYWAY_LOCATIONS: filesystem:/app/db/migration/wp1
      # Redis / Kafka
      PLATFORM_REDIS_ADDRESS: redis://redis:6379
      PLATFORM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # XXL-JOB
      PLATFORM_XXL_JOB_ENABLED: "true"
      PLATFORM_XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      PLATFORM_XXL_JOB_ACCESS_TOKEN: shared-xxl-job-access-token
      PLATFORM_XXL_JOB_EXECUTOR_PORT: "9999"
      # 认证
      WP1_AUTH_TOKEN_SECRET: local-auth-secret-32-byte-minimum!
      WP1_ACCESS_TOKEN_TTL_MINUTES: 120
      WP1_LOCAL_SECRET_MASTER_KEY: "0123456789abcdef0123456789abcdef"
      # 外部 Vault/KMS 接入时启用，token 只通过环境变量注入，不能写入 secret_provider.config_json
      WP1_EXTERNAL_SECRET_RESOLVE_URL: ${WP1_EXTERNAL_SECRET_RESOLVE_URL:-}
      WP1_EXTERNAL_SECRET_AUTH_TOKEN: ${WP1_EXTERNAL_SECRET_AUTH_TOKEN:-}
      # 服务令牌
      WP1_SERVICE_TOKEN: shared-platform-service-token
      WP2_SERVICE_TOKEN: shared-model-access-token
      WP3_SERVICE_TOKEN: shared-asset-token
      WP4_OCR_COMMAND: ${WP4_OCR_COMMAND:-}
      WP4_OCR_TIMEOUT_SECONDS: ${WP4_OCR_TIMEOUT_SECONDS:-30}
      WP4_OCR_MAX_OUTPUT_CHARS: ${WP4_OCR_MAX_OUTPUT_CHARS:-20000}
      WP4_OCR_MAX_CONCURRENT_PROCESSES: ${WP4_OCR_MAX_CONCURRENT_PROCESSES:-2}
      PLATFORM_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://ai-test.songhg.com
      PLATFORM_STORAGE_PROVIDER: local
      PLATFORM_STORAGE_ROOT_DIR: /tmp/veri-agent/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    networks:
      - veri-agent-net

  # ─────────────────────────────────────────────────
  # 前端: portal-web (Nginx + React 生产构建)
  # ─────────────────────────────────────────────────
  portal-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.portal-web
    container_name: veri-agent-portal-web
    ports:
      - "5173:80"
    depends_on:
      - platform-api
    networks:
      - veri-agent-net

networks:
  veri-agent-net:
    driver: bridge

volumes:
  veri-agent-postgres:
  veri-agent-redis:
  veri-agent-kafka:
  veri-agent-xxl-job-mysql:
  veri-agent-xxl-job-admin:
